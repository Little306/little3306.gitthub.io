<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NVH REPO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;

background:
radial-gradient(circle at top,#4c148a,#130021 60%,#090011);
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:500px;
height:500px;
background:#5f00ff;
filter:blur(180px);
opacity:.3;
top:-100px;
left:-100px;
animation:move1 10s infinite alternate;
}

body::after{
content:"";
position:fixed;
width:400px;
height:400px;
background:#00d4ff;
filter:blur(180px);
opacity:.2;
bottom:-100px;
right:-100px;
animation:move2 12s infinite alternate;
}

@keyframes move1{
to{
transform:translate(100px,100px);
}
}

@keyframes move2{
to{
transform:translate(-100px,-80px);
}
}

.container{
width:100%;
max-width:520px;
position:relative;
z-index:2;
text-align:center;
}

.logo{
width:170px;
height:170px;
border-radius:50%;
border:4px solid #38dfff;
box-shadow:
0 0 20px #38dfff,
0 0 50px #38dfff;
animation:pulse 2s infinite;
object-fit:cover;
background:white;
}

@keyframes pulse{
50%{
box-shadow:
0 0 30px #38dfff,
0 0 80px #38dfff;
}
}

.title{
font-size:58px;
font-weight:800;
margin-top:25px;

background:linear-gradient(
90deg,
#00d4ff,
#ffffff,
#d78cff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.status{
margin-top:15px;
font-size:23px;
color:#ddd;
}

.online{
display:inline-block;
width:14px;
height:14px;
border-radius:50%;
background:#00ff55;
box-shadow:0 0 12px #00ff55;
margin-right:10px;
}

.repo-box{
margin-top:30px;

display:flex;
justify-content:space-between;
align-items:center;

padding:18px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.1);

border-radius:25px;
}

.repo-link{
font-size:20px;
font-weight:700;
word-break:break-all;
}

.copy-btn{
padding:12px 20px;
border:none;
border-radius:15px;
cursor:pointer;

background:#233f88;
color:#7ecfff;

font-weight:700;
}

.copy-btn:hover{
transform:scale(1.05);
}

.btn{
display:block;

margin-top:22px;

padding:18px;

border-radius:25px;

text-decoration:none;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(10px);

font-size:30px;
font-weight:700;

transition:.3s;
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 0 25px rgba(255,255,255,.15);
}

.cydia{
color:#ffb566;
}

.sileo{
color:#35ff8d;
}

.zebra{
color:#d67cff;
}

.saily{
color:#6ca8ff;
}

.footer{
margin-top:35px;
font-size:14px;
color:#888;
}

</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<div class="title">NVH REPO</div>

<div class="status">
<span class="online"></span>
Đang hoạt động - Sẵn sàng phục vụ bạn
</div>

<div class="repo-box">

<div class="repo-link" id="repo">
https://nvhrepo.github.io/
</div>

<button class="copy-btn" onclick="copyRepo()">
SAO CHÉP
</button>

</div>

<a class="btn cydia"
href="cydia://url/https://cydia.saurik.com/api/share#?source=https://nvhrepo.github.io/">
➕ Thêm vào Cydia
</a>

<a class="btn sileo"
href="sileo://source/https://nvhrepo.github.io/">
⚡ Thêm vào Sileo
</a>

<a class="btn zebra"
href="zbra://sources/add/https://nvhrepo.github.io/">
☰ Thêm vào Zebra
</a>

<a class="btn saily"
href="saily://source/https://nvhrepo.github.io/">
👜 Thêm vào Saily
</a>

<div class="footer">
© 2026 NVH Repo
</div>

</div>

<script>

function copyRepo(){

const text =
"https://nvhrepo.github.io/";

navigator.clipboard.writeText(text);

alert("Đã sao chép repo!");

}

</script>

</body>
</html>
