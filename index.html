<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JTISVN REPO</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    background:linear-gradient(135deg,#07001d,#22003f);
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

.logo{
    width:160px;
    height:160px;
    border-radius:50%;
    margin:auto;
    display:block;
    border:5px solid #38d9ff;
    box-shadow:0 0 30px #38d9ff;
}

h1{
    text-align:center;
    margin-top:20px;
    font-size:50px;
    background:linear-gradient(90deg,#38d9ff,#c78cff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.status{
    text-align:center;
    margin:15px 0 30px;
    font-size:20px;
}

.dot{
    display:inline-block;
    width:15px;
    height:15px;
    background:#00ff55;
    border-radius:50%;
    box-shadow:0 0 15px #00ff55;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:.3;
    }
}

.card{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:22px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #b26cff;
}

.left{
    display:flex;
    align-items:center;
    gap:15px;
}

.icon{
    width:55px;
    height:55px;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.green{background:#00b96b;}
.pink{background:#ff2b92;}
.purple{background:#7c4dff;}

.arrow{
    opacity:.6;
}

.support{
    text-align:center;
    margin-top:30px;
}

.support button{
    border:none;
    background:#ff4fa0;
    color:white;
    padding:15px 40px;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 0 25px #ff4fa0;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>JTISVN REPO</h1>

<div class="status">
<span class="dot"></span>
&nbsp; Đang hoạt động
</div>

<div class="card" onclick="goPage('dns.html')">
<div class="left">
<div class="icon green">
<i class="fa-solid fa-shield"></i>
</div>
<div>
<h3>DNS Chặn Quảng Cáo</h3>
<p>Cài đặt cấu hình DNS</p>
</div>
</div>
<i class="fa-solid fa-chevron-right arrow"></i>
</div>

<div class="card" onclick="goPage('ipa.html')">
<div class="left">
<div class="icon pink">
<i class="fa-brands fa-apple"></i>
</div>
<div>
<h3>Kho IPA</h3>
<p>Thư viện IPA Mod</p>
</div>
</div>
<i class="fa-solid fa-chevron-right arrow"></i>
</div>

<div class="card" onclick="goPage('dylib.html')">
<div class="left">
<div class="icon purple">
<i class="fa-solid fa-microchip"></i>
</div>
<div>
<h3>Kho Dylib</h3>
<p>Dylib Mod & Việt hóa</p>
</div>
</div>
<i class="fa-solid fa-chevron-right arrow"></i>
</div>

<div class="support">
<button onclick="window.location.href='https://facebook.com'">
❤️ Ủng hộ tôi
</button>
</div>

</div>

<script>
function goPage(link){
    window.location.href = link;
}
</script>

</body>
</html>
goPage('dns.html')
goPage('ipa.html')
goPage('dylib.html')
