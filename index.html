<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Repo</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#121212;
    color:white;
    transition:0.3s;
}

header{
    text-align:center;
    padding:30px;
}

.logo{
    width:120px;
    border-radius:20px;
}

.status{
    color:red;
    font-weight:bold;
}

.toggle{
    position:fixed;
    top:15px;
    right:15px;
    padding:10px;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.app{
    display:flex;
    align-items:center;
    gap:15px;
    background:#1e1e1e;
    padding:15px;
    margin:15px 0;
    border-radius:12px;
}

.app img{
    width:70px;
    height:70px;
    border-radius:15px;
}

.download{
    margin-left:auto;
    background:#ff3b30;
    color:white;
    padding:10px 15px;
    text-decoration:none;
    border-radius:10px;
}

.light{
    background:white;
    color:black;
}

.light .app{
    background:#f0f0f0;
}
</style>
</head>
<body>

<button class="toggle" onclick="toggleMode()">🌙</button>

<header>
    <img src="logo.png" class="logo">
    <h1>Little Repo</h1>

    <p>
        Kho IPA dành cho người dùng jailbreak và sideload.
        Cập nhật ứng dụng thường xuyên với tốc độ tải nhanh.
    </p>

    <p class="status">🔴 Trạng thái: Đang hoạt động</p>
</header>

<div class="container">

    <div class="app">
        <img src="uyou.png">
        <div>
            <h3>uYou+</h3>
            <p>YouTube nâng cao.</p>
        </div>
        <a href="#" class="download">Tải IPA</a>
    </div>

    <div class="app">
        <img src="tiktok.png">
        <div>
            <h3>TikTok Plus</h3>
            <p>TikTok không quảng cáo.</p>
        </div>
        <a href="#" class="download">Tải IPA</a>
    </div>

    <div class="app">
        <img src="spotify.png">
        <div>
            <h3>Spotify++</h3>
            <p>Phiên bản tùy chỉnh.</p>
        </div>
        <a href="#" class="download">Tải IPA</a>
    </div>

</div>

<script>
function toggleMode(){
    document.body.classList.toggle("light");
}
</script>

</body>
</html>
